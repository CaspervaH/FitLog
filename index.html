<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitLog — CrossFit logboek</title>
<style>
:root{--green:#2e7d32;--green-l:#e8f5e9;--ink:#1b1b1b;--mut:#6b7268;--bg:#f6f7f5;--card:#fff;--line:#e2e5e0;--red:#c62828;--gold:#b8860b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:1.25rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.95rem}
.tabs button.on{background:#fff;color:var(--green);font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.15rem}
h3{margin:14px 0 8px;font-size:1rem}
.mut{color:var(--mut)}
.chip{display:inline-block;background:var(--green-l);color:var(--green);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;margin-left:6px}
.chip.src{background:#eef1f7;color:#3b4a86}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead .date{font-size:1.35rem;font-weight:700}
.dayhead .wd{color:var(--mut);font-size:.95rem}
.nav{display:flex;gap:6px;align-items:center}
.nav button{font-size:1.3rem;background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;cursor:pointer}
.nav a{font-size:.85rem;color:var(--green)}
.wod-text{white-space:pre-line;background:var(--green-l);border-radius:10px;padding:12px 14px;font-size:1.02rem}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
button.save{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:12px}
.toggle{display:flex;gap:0;margin-top:10px}
.toggle button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--mut)}
.toggle button:first-child{border-radius:8px 0 0 8px}
.toggle button:last-child{border-radius:0 8px 8px 0}
.toggle button.on.rx{background:var(--green);color:#fff;border-color:var(--green)}
.toggle button.on.sc{background:#ef6c00;color:#fff;border-color:#ef6c00}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;color:var(--mut);letter-spacing:.03em}
.pr{color:var(--gold);font-weight:700}
.del{background:none;border:0;color:var(--red);cursor:pointer;font-size:1rem;padding:2px 6px}
.result{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fffdf5}
.result .score{font-weight:700}
.sim{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.sim .pct{color:var(--green);font-weight:700}
.msg{background:var(--green-l);color:var(--green);border-radius:10px;padding:10px 12px;font-weight:600;margin-top:10px}
.rest{background:#eef1f7;color:#3b4a86;border-radius:12px;padding:24px;text-align:center;font-size:1.05rem}
small.hint{color:var(--mut)}
@media(max-width:520px){main{padding:10px}.dayhead{flex-wrap:wrap}}
</style>
</head>

ain":null,"source":"crossfit.com"},{"id":"261001","date":"2026-10-01","weekday":"donderdag","name":null,"type":"rest","text":"Rest day","movements":[],"timeDomain":null,"source":"crossfit.com"}];

const LIFT_SUGGEST = ['back squat','front squat','overhead squat','deadlift','sumo deadlift high pull','snatch','power snatch','hang power snatch','hang squat snatch','clean','power clean','hang power clean','squat clean','clean and jerk','push jerk','split jerk','bench press','push press','shoulder press','thruster','overhead press'];

// ---------- state & opslag ----------
let state = load();
let HQ_WODS = [...BUILTIN_WODS];

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    return {
      results: Array.isArray(s.results) ? s.results : [],
      lifts: Array.isArray(s.lifts) ? s.lifts : [],
      view: 'wod',
      date: todayISO()
    };
  }catch(e){ return {results:[],lifts:[],view:'wod',date:todayISO()}; }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify({results:state.results, lifts:state.lifts})); }

function todayISO(){ const d = new Date(); return iso(d); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = fromISO(s); d.setDate(d.getDate()+n); return iso(d); }
function fmtDate(s){ const d = fromISO(s); return DAY_NL[d.getDay()] + ' ' + d.getDate() + ' ' + MON_NL[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtShort(s){ const d = fromISO(s); return d.getDate() + '-' + (d.getMonth()+1) + '-' + d.getFullYear(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- HQ-WOD's ----------
function loadHqWods(){
  fetch('hq-wods.json')
    .then(r => r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
    .then(j => {
      const list = Array.isArray(j) ? j : (Array.isArray(j.wods) ? j.wods : []);
      if(list.length){
        HQ_WODS = list;
        if(state.view === 'wod') render();
      }
    })
    .catch(()=>{ /* offline/lokaal: ingebakken data volstaat */ });
}
function hqWod(dateISO){
  const key = dateISO.slice(2,4) + dateISO.slice(5,7) + dateISO.slice(8,10);
  return HQ_WODS.find(w => String(w.id) === key) || HQ_WODS.find(w => w.date === dateISO) || null;
}

// ---------- scores ----------
function scoreSeconds(r){ return (r.min||0)*60 + (r.sec||0); }
function scoreLabel(r){
  if(!r) return '—';
  const t = r.type;
  if(t === 'time') return (r.min||0) + ':' + String(r.sec||0).padStart(2,'0');
  if(t === 'amrap') return (r.rounds||0) + ' rondes' + (r.reps ? ' + ' + r.reps + ' reps' : '');
  if(t === 'load') return (r.kg||0) + ' kg';
  if(t === 'reps') return (r.reps||0) + ' reps';
  return r.txt || '—';
}
function isBetter(a, b){
  if(!b) return true;
  const t = a.type;
  if(t === 'time') return scoreSeconds(a) < scoreSeconds(b);
  if(t === 'amrap') return ((a.rounds||0)*100 + (a.reps||0)) > ((b.rounds||0)*100 + (b.reps||0));
  if(t === 'load') return (a.kg||0) > (b.kg||0);
  if(t === 'reps') return (a.reps||0) > (b.reps||0);
  return false;
}
function bestOf(results){
  let best = null;
  for(const r of results) if(isBetter(r, best)) best = r;
  return best;
}
function resultsFor(name){ return state.results.filter(r => r.wodName === name); }

// Vergelijkbaarheid: % bewegingsoverlap t.o.v. de referentie-WOD.
function similarity(wod, other){
  const a = wod.movements || [], b = other.movements || [];
  if(!a.length || !b.length) return 0;
  const setB = new Set(b);
  const overlap = a.filter(m => setB.has(m)).length;
  return Math.round(100 * overlap / a.length);
}

// ---------- render ----------
const app = document.getElementById('app');
function setView(v){ state.view = v; render(); }
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if(b) setView(b.dataset.v);
});

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  if(state.view === 'wod') renderWod();
  else if(state.view === 'bench') renderBench();
  else if(state.view === 'lift') renderLift();
  else renderLog();
}

// ===== 📅 WOD (startpagina) =====
function renderWod(){
  const d = state.date;
  const isToday = d === todayISO();
  const w = hqWod(d);
  let html = '';
  html += '<section class="card"><div class="dayhead">'
    + '<div><div class="wd">' + (isToday ? 'Vandaag' : '&nbsp;') + '</div><div class="date">' + fmtDate(d) + '</div></div>'
    + '<div class="nav"><button id="prev" title="Vorige dag">‹</button>'
    + '<button id="next" title="Volgende dag">›</button>'
    + (isToday ? '' : '<a href="#" id="backToday">↩ terug naar vandaag</a>')
    + '</div></div></section>';

  if(w && w.type === 'rest'){
    html += '<section class="card"><div class="rest">😴 Rustdag</div></section>';
  } else if(w){
    html += '<section class="card"><h2>WOD' + (w.name ? ' — ' + esc(w.name) : '') + '<span class="chip src">' + esc(w.source || 'crossfit.com') + '</span></h2>'
      + '<div class="wod-text">' + esc(w.text) + '</div>'
      + (w.timeDomain ? '<p class="mut" style="margin:8px 0 0">Tijdsdomein: ' + esc(w.timeDomain) + '</p>' : '')
      + '</section>';
    html += historyHtml(w, d);
    html += similarHtml(w, d);
    html += formHtml(w.name || 'HQ WOD', w.type, w.text, w.movements, w.timeDomain);
  } else {
    html += '<section class="card"><div class="rest">Geen HQ-WOD bekend voor deze datum.</div>'
      + '<label for="wodName">WOD-naam (optioneel, bijv. je box-WOD)</label>'
      + '<input id="wodName" placeholder="bv. Fran of eigen box-WOD">'
      + '<label for="wodText">Omschrijving</label>'
      + '<textarea id="wodText" rows="3" placeholder="Wat stond er op het bord?"></textarea>'
      + '<label for="wodType">Score-type</label>'
      + '<select id="wodType"><option value="time">Voor tijd</option><option value="amrap">AMRAP</option><option value="load">Max load</option><option value="reps">Max reps</option><option value="other">Anders</option></select>'
      + '</section>';
    html += '<section class="card"><h3>Resultaat invoeren</h3>'
      + '<div class="toggle" id="lvlToggle"><button type="button" data-lvl="rx" class="on rx">Rx\u2019d</button><button type="button" data-lvl="sc" class="sc">Scaled</button></div>'
      + '<div id="scoreFields"></div>'
      + '<label for="fnotes">Scaling / notities</label>'
      + '<textarea id="fnotes" rows="2" placeholder="bijv. 40 kg thrusters, jumping pull-ups"></textarea>'
      + '<button class="save" id="saveBtn">Opslaan</button><div id="formMsg"></div></section>';
  }
  app.innerHTML = html;
  document.getElementById('prev').onclick = () => { state.date = addDays(d, -1); render(); };
  document.getElementById('next').onclick = () => { state.date = addDays(d, 1); render(); };
  const bt = document.getElementById('backToday');
  if(bt) bt.onclick = e => { e.preventDefault(); state.date = todayISO(); render(); };
  if(!w || w.type !== 'rest'){
    bindForm();
    if(!w){
      const typeSel = document.getElementById('wodType');
      const fields = document.getElementById('scoreFields');
      const draw = () => { fields.innerHTML = scoreFieldsHtml(typeSel.value); bindScaledToggle(); };
      typeSel.onchange = draw; draw();
    }
  }
}

function historyHtml(w, dateISO){
  const name = w.name || 'HQ WOD';
  const sameDay = state.results.filter(r => r.date === dateISO);
  const byName = w.name ? resultsFor(w.name).filter(r => r.date !== dateISO) : [];
  const prevBest = byName.length ? bestOf(byName) : null;
  let html = '';
  if(sameDay.length || prevBest){
    html += '<section class="card"><h3>Eerdere resultaten</h3>';
    for(const r of sameDay){
      html += '<div class="result"><span class="score">' + scoreLabel(r) + '</span> — ' + (r.scaled ? 'Scaled' : "Rx'd")
        + (r.notes ? ' · <span class="mut">' + esc(r.notes) + '</span>' : '') + '</div>';
    }
    if(prevBest){
      html += '<div class="result">Je hebt <strong>' + esc(w.name) + '</strong> eerder gedaan — beste score: <span class="score">'
        + scoreLabel(prevBest) + '</span> (' + (prevBest.scaled ? 'Scaled' : "Rx'd") + ', ' + fmtShort(prevBest.date) + ')</div>';
    }
    html += '</section>';
  }
  return html;
}

function similarHtml(w, dateISO){
  const name = w.name || 'HQ WOD';
  const sims = [];
  for(const r of state.results){
    if(r.date === dateISO) continue;
    if(w.name && r.wodName === w.name) continue;
    const pct = similarity(w, r);
    if(pct >= 50) sims.push({r, pct});
  }
  sims.sort((a,b) => b.pct - a.pct || (a.r.date < b.r.date ? 1 : -1));
  if(!sims.length) return '';
  const rows = sims.slice(0, 6).map(s =>
    '<tr><td>' + fmtShort(s.r.date) + '</td><td>' + esc(s.r.wodName) + '</td><td><span class="pct">' + s.pct + '%</span></td><td>'
    + scoreLabel(s.r) + '</td><td>' + (s.r.scaled ? 'Scaled' : "Rx'd") + '</td></tr>').join('');
  return '<section class="card"><h3>Vergelijkbare WOD\u2019s uit je historie</h3>'
    + '<table><tr><th>Datum</th><th>WOD</th><th>Overlap</th><th>Resultaat</th><th>Level</th></tr>' + rows + '</table>'
    + '<small class="hint">Overlap = deel van de bewegingen van deze WOD dat ook in die WOD voorkomt.</small></section>';
}

function scoreFieldsHtml(type){
  if(type === 'time') return '<div class="row"><div><label for="fmin">Minuten</label><input id="fmin" type="number" min="0" inputmode="numeric"></div>'
    + '<div><label for="fsec">Seconden</label><input id="fsec" type="number" min="0" max="59" inputmode="numeric"></div></div>';
  if(type === 'amrap') return '<div class="row"><div><label for="frounds">Rondes</label><input id="frounds" type="number" min="0" inputmode="numeric"></div>'
    + '<div><label for="freps">Extra reps</label><input id="freps" type="number" min="0" inputmode="numeric"></div></div>';
  if(type === 'load') return '<div><label for="fkg">Kilogram</label><input id="fkg" type="number" min="0" step="0.5" inputmode="decimal"></div>';
  if(type === 'reps') return '<div><label for="freps">Reps</label><input id="freps" type="number" min="0" inputmode="numeric"></div>';
  return '<div><label for="ftxt">Score (vrije tekst)</label><input id="ftxt" placeholder="bijv. 3 rondes + time cap gehaald"></div>';
}

function formHtml(name, type, text, movements, td){
  return '<section class="card"><h3>Resultaat invoeren</h3>'
    + '<input type="hidden" id="formMode" value="hq">'
    + '<input type="hidden" id="wodName" value="' + esc(name) + '">'
    + '<input type="hidden" id="wodText" value="' + esc(text) + '">'
    + '<input type="hidden" id="wodType" value="' + esc(type) + '">'
    + '<input type="hidden" id="wodMovs" value="' + esc((movements||[]).join(',')) + '">'
    + '<input type="hidden" id="wodTd" value="' + esc(td || '') + '">'
    + '<div class="toggle" id="lvlToggle"><button type="button" data-lvl="rx" class="on rx">Rx\u2019d</button><button type="button" data-lvl="sc" class="sc">Scaled</button></div>'
    + '<div id="scoreFields">' + scoreFieldsHtml(type) + '</div>'
    + '<label for="fnotes">Scaling / notities</label>'
    + '<textarea id="fnotes" rows="2" placeholder="bijv. 40 kg thrusters, jumping pull-ups"></textarea>'
    + '<button class="save" id="saveBtn">Opslaan</button><div id="formMsg"></div></section>';
}

function bindScaledToggle(){
  const tog = document.getElementById('lvlToggle');
  if(!tog) return;
  tog.querySelectorAll('button').forEach(b => b.onclick = () => {
    tog.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
}

function readForm(){
  const type = document.getElementById('wodType').value;
  const nameEl = document.getElementById('wodName');
  const name = nameEl.value.trim() || 'WOD ' + fmtShort(state.date);
  const text = (document.getElementById('wodText').value || '').trim();
  const movements = (document.getElementById('wodMovs') ? document.getElementById('wodMovs').value : '')
    .split(',').map(s => s.trim()).filter(Boolean);
  const td = document.getElementById('wodTd') ? document.getElementById('wodTd').value : '';
  const lvls = document.querySelectorAll('#lvlToggle button.on');
  const scaled = lvls.length ? lvls[0].dataset.lvl === 'sc' : false;
  const notes = (document.getElementById('fnotes').value || '').trim();
  const r = { id: uid(), date: state.date, wodName: name, wodText: text, movements, type, timeDomain: td, scaled, notes };
  if(type === 'time'){ r.min = Number(document.getElementById('fmin').value || 0); r.sec = Number(document.getElementById('fsec').value || 0); }
  else if(type === 'amrap'){ r.rounds = Number(document.getElementById('frounds').value || 0); r.reps = Number(document.getElementById('freps').value || 0); }
  else if(type === 'load'){ r.kg = Number(document.getElementById('fkg').value || 0); }
  else if(type === 'reps'){ r.reps = Number(document.getElementById('freps').value || 0); }
  else { r.txt = document.getElementById('ftxt').value.trim(); }
  return r;
}

function bindForm(){
  bindScaledToggle();
  document.getElementById('saveBtn').onclick = () => {
    const r = readForm();
    const earlier = resultsFor(r.wodName).filter(x => x.date !== r.date);
    const prevBest = bestOf(earlier);
    const isPR = !prevBest ? true : isBetter(r, prevBest);
    state.results.push(r);
    save();
    render();
    const msg = document.getElementById('formMsg');
    if(msg && isPR && earlier.length){
      msg.innerHTML = '<div class="msg">🏆 Nieuwe PR! Vorige beste: ' + scoreLabel(prevBest) + '</div>';
      msg.scrollIntoView({block:'nearest'});
    } else if(msg){
      msg.innerHTML = '<div class="msg">Opgeslagen' + (isPR && !earlier.length ? ' — eerste keer deze WOD, dat is meteen je PR!' : '') + '</div>';
    }
  };
}

// ===== Benchmark =====
function renderBench(){
  let html = '<section class="card"><h2>Benchmark-WOD\u2019s &amp; PR\u2019s</h2>'
    + '<table><tr><th>WOD</th><th>Type</th><th>PR</th><th>Level</th><th>Datum</th><th>× gedaan</th><th></th></tr>';
  for(const b of BENCHMARKS){
    const rs = resultsFor(b.n);
    const best = rs.length ? bestOf(rs) : null;
    html += '<tr><td><strong>' + b.n + '</strong></td><td class="mut">' + typeLabel(b.t) + '</td>'
      + (best ? '<td><span class="pr">' + scoreLabel(best) + '</span></td><td>' + (best.scaled ? 'Scaled' : "Rx'd") + '</td><td>' + fmtShort(best.date) + '</td><td>' + rs.length + '×</td>'
             : '<td class="mut">—</td><td class="mut">—</td><td class="mut">—</td><td class="mut">0×</td>')
      + '</tr>';
  }
  html += '</table></section>';
  html += '<section class="card"><h3>Benchmark-omschrijvingen</h3>';
  for(const b of BENCHMARKS){
    html += '<h3>' + b.n + ' <span class="chip">' + (b.td || typeLabel(b.t)) + '</span></h3><div class="wod-text">' + esc(b.x) + '</div>'
      + '<p class="mut" style="margin:6px 0 0;font-size:.85rem">Bewegingen: ' + esc(b.m.join(', ')) + '</p>';
  }
  html += '</section>';
  app.innerHTML = html;
}
function typeLabel(t){
  return {time:'voor tijd', amrap:'AMRAP', load:'max load', reps:'max reps', other:'anders', rest:'rustdag'}[t] || t;
}

// ===== Lifting =====
function renderLift(){
  const byLift = {};
  for(const l of state.lifts){ (byLift[l.lift] = byLift[l.lift] || []).push(l); }
  let html = '<section class="card"><h2>Lifting loggen</h2>'
    + '<div class="row"><div><label for="lName">Oefening</label><input id="lName" list="liftList" placeholder="bv. back squat"></div>'
    + '<div><label for="lKg">Kilogram</label><input id="lKg" type="number" min="0" step="0.5" inputmode="decimal"></div>'
    + '<div><label for="lReps">Reps</label><input id="lReps" type="number" min="1" inputmode="numeric"></div></div>'
    + '<datalist id="liftList">' + LIFT_SUGGEST.map(l => '<option value="' + esc(l) + '">').join('') + '</datalist>'
    + '<button class="save" id="liftBtn">Log lift</button></section>';
  html += '<section class="card"><h2>PR-overzicht</h2>';
  const names = Object.keys(byLift);
  if(!names.length) html += '<p class="mut">Nog geen lifts gelogd.</p>';
  else{
    html += '<table><tr><th>Oefening</th><th>Zwaarste set</th><th>Geschatte 1RM</th><th>Echte 1RM</th><th>Sessions</th></tr>';
    for(const n of names.sort()){
      const ls = byLift[n];
      const heaviest = ls.reduce((a,b) => (b.kg > a.kg ? b : a), ls[0]);
      const est1rm = Math.max(...ls.map(l => l.reps === 1 ? l.kg : l.kg * (1 + l.reps/30)));
      const real1rm = ls.filter(l => l.reps === 1).reduce((a,b) => Math.max(a,b.kg), 0);
      html += '<tr><td><strong>' + esc(n) + '</strong></td><td>' + heaviest.kg + ' kg × ' + heaviest.reps + '</td>'
        + '<td>' + est1rm.toFixed(1) + ' kg</td><td>' + (real1rm ? real1rm + ' kg' : '<span class="mut">—</span>') + '</td><td>' + ls.length + '</td></tr>';
    }
    html += '</table><small class="hint">Geschatte 1RM via Epley: gewicht × (1 + reps/30).</small>';
  }
  html += '</section>';
  const recent = [...state.lifts].sort((a,b) => a.date < b.date ? 1 : -1).slice(0, 15);
  if(recent.length){
    html += '<section class="card"><h3>Recente lifts</h3><table><tr><th>Datum</th><th>Oefening</th><th>Set</th><th></th></tr>';
    for(const l of recent){
      html += '<tr><td>' + fmtShort(l.date) + '</td><td>' + esc(l.lift) + '</td><td>' + l.kg + ' kg × ' + l.reps + '</td>'
        + '<td><button class="del" data-del="' + l.id + '">🗑</button></td></tr>';
    }
    html += '</table></section>';
  }
  app.innerHTML = html;
  document.getElementById('liftBtn').onclick = () => {
    const n = document.getElementById('lName').value.trim();
    const kg = Number(document.getElementById('lKg').value || 0);
    const reps = Number(document.getElementById('lReps').value || 0);
    if(!n || !kg || !reps){ alert('Vul oefening, kilo\u2019s en reps in.'); return; }
    state.lifts.push({id: uid(), date: todayISO(), lift: n, kg, reps});
    save(); renderLift();
  };
  app.querySelectorAll('button[data-del]').forEach(b => b.onclick = () => {
    state.lifts = state.lifts.filter(l => l.id !== b.dataset.del);
    save(); renderLift();
  });
}

// ===== WOD-log =====
function renderLog(){
  const q = (window.__logQ || '').toLowerCase();
  const rs = [...state.results].sort((a,b) => a.date < b.date ? 1 : -1)
    .filter(r => !q || r.wodName.toLowerCase().includes(q) || (r.notes||'').toLowerCase().includes(q));
  let html = '<section class="card"><h2>WOD-log</h2>'
    + '<div class="row"><div><label for="logQ">Zoeken</label><input id="logQ" value="' + esc(window.__logQ || '') + '" placeholder="WOD-naam of notitie"></div></div>'
    + '<p class="mut">' + state.results.length + ' resultaten</p>';
  if(rs.length){
    html += '<table><tr><th>Datum</th><th>WOD</th><th>Resultaat</th><th>Level</th><th></th></tr>';
    for(const r of rs){
      html += '<tr><td>' + fmtShort(r.date) + '</td><td><strong>' + esc(r.wodName) + '</strong><br><small class="mut">' + esc((r.wodText||'').split('\n')[0].slice(0,60)) + '</small></td>'
        + '<td class="pr">' + scoreLabel(r) + '</td><td>' + (r.scaled ? 'Scaled' : "Rx'd") + '</td>'
        + '<td><button class="del" data-del="' + r.id + '">🗑</button></td></tr>';
    }
    html += '</table>';
  } else html += '<p class="mut">Nog niets gelogd.</p>';
  html += '</section>';
  html += '<section class="card"><h3>Backup</h3><div class="row">'
    + '<div><button class="save" id="expBtn">⬇ Export (JSON)</button></div>'
    + '<div><label for="impFile">⬆ Import</label><input id="impFile" type="file" accept="application/json"></div></div>'
    + '<small class="hint">De export bevat je resultaten, lifts en WOD-geschiedenis.</small></section>';
  app.innerHTML = html;
  document.getElementById('logQ').oninput = e => { window.__logQ = e.target.value; renderLog(); document.getElementById('logQ').focus(); };
  app.querySelectorAll('button[data-del]').forEach(b => b.onclick = () => {
    state.results = state.results.filter(r => r.id !== b.dataset.del);
    save(); renderLog();
  });
  document.getElementById('expBtn').onclick = () => {
    const blob = new Blob([JSON.stringify({app:'fitlog', version:1, exported:new Date().toISOString(), results:state.results, lifts:state.lifts}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fitlog-backup-' + todayISO() + '.json';
    a.click();
  };
  document.getElementById('impFile').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        let nr = [], nl = [];
        if(Array.isArray(j.results)) nr = j.results;                     // fitlog-formaat
        else if(Array.isArray(j)) nr = j;                                // oude export: platte lijst resultaten
        if(Array.isArray(j.lifts)) nl = j.lifts;
        const have = new Set(state.results.map(r => r.date + '|' + r.wodName + '|' + scoreLabel(r)));
        for(const r of nr){ if(!have.has(r.date + '|' + r.wodName + '|' + scoreLabel(r))) state.results.push(r); }
        for(const l of nl) state.lifts.push(l);
        save(); renderLog();
      }catch(err){ alert('Ongeldig back-upbestand: ' + err.message); }
    };
    rd.readAsText(f);
  };
}

// ---------- start ----------
loadHqWods();
render();
</script>
</body>
</html>
