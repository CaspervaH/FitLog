name: Update HQ WODs

# Dagelijkse crossfit.com-scrape staat uit: de box programmeert zelf (Virtuagym)
# en gebruikt crossfit.com niet meer. Handmatig draaien kan via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape-wods.mjs
      - name: Commit indien gewijzigd
        run: |
          git config user.name "fitlog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hq-wods.json
          git diff --cached --quiet || git commit -m "chore: HQ-WOD's bijwerken van crossfit.com"
          git push
