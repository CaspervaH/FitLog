name: Update HQ WODs

on:
  schedule:
    # GitHub geplande runs lopen vaak ~1-2 uur vertraagd; crossfit.com publiceert
    # de WOD doorgaans vroeg in de ochtend (US-tijd). Daarom twee momenten: de
    # vroege run vangt late publicatie op, de late run is de vangnet-run.
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape-wods.mjs
      - name: Commit indien gewijzigd
        run: |
          git config user.name "fitlog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hq-wods.json
          git diff --cached --quiet || git commit -m "chore: HQ-WOD's bijwerken van crossfit.com"
          git push
